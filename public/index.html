<!DOCTYPE html>
<html lang="en">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Object Detection MVP</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Core Object Detection Test</h1>

        <p id="status">Initializing...</p>



        <div id="image-container">
            <img
                id="test-image"
                src="test-image-old.jpg"  alt="Test image"
            />
        </div>

        <div id="detection-list-container" style="margin-top: 15px;">
            <h3>Objects found:</h3>
            <ul id="detection-list">
                </ul>
        </div>

        <div class="upload-controls">
        <label for="image-upload">Upload Image:</label>
        <input type="file" id="image-upload" accept="image/*" style="margin-bottom: 10px;">
        </div>
    
        <button id="detect-button" disabled>Detect objects</button>


        <script type="module" src="app.js"></script>

    </body>
</html>
